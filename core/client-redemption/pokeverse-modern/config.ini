; Public client settings read at startup. The [font] section of Redemption's config.ini is left
; out on purpose: it would replace the PokeVerse window fonts with TTF fonts.

[graphics]
; hard cap for atlas textures, in pixels
maxAtlasSize = 8192
; 0 = auto-detect from the GPU's maximum texture size, -1 = no atlas
mapAtlasSize = 0
foregroundAtlasSize = 2048
