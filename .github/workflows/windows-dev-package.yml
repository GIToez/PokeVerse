name: Windows dev package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MARIADB_VERSION: 11.4.8

jobs:
  build:
    name: Build server and client (Windows, MSYS2)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            unzip
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-lua51
            mingw-w64-x86_64-gmp
            mingw-w64-x86_64-sqlite3
            mingw-w64-x86_64-libmariadbclient
            mingw-w64-x86_64-libxml2
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-physfs
            mingw-w64-x86_64-glew
            mingw-w64-x86_64-openal
            mingw-w64-x86_64-libogg
            mingw-w64-x86_64-libvorbis

      - name: Build server
        run: |
          cmake -S core/server -B build/server -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/server

      - name: Build client
        if: ${{ !cancelled() }}
        run: |
          cmake -S core/client-legacy -B build/client -G Ninja -DCMAKE_BUILD_TYPE=Release -DUSE_STATIC_LIBS=OFF \
            -DBUILD_COMMIT=${GITHUB_SHA::7} -DBUILD_REVISION=${GITHUB_RUN_NUMBER}
          cmake --build build/client

      - name: Cache MariaDB
        uses: actions/cache@v4
        with:
          path: mariadb.zip
          key: mariadb-${{ env.MARIADB_VERSION }}-winx64

      - name: Download MariaDB
        run: |
          [ -f mariadb.zip ] || curl -fsSL -o mariadb.zip \
            "https://archive.mariadb.org/mariadb-${MARIADB_VERSION}/winx64-packages/mariadb-${MARIADB_VERSION}-winx64.zip"

      - name: Assemble package
        run: scripts/package-windows.sh build/server build/client mariadb.zip dist

      - name: Collect Mesa software OpenGL for the CI client test (not shipped)
        run: |
          pacman -S --needed --noconfirm mingw-w64-x86_64-mesa
          mkdir -p ci-mesa
          cp /mingw64/bin/opengl32.dll /mingw64/bin/libgallium_wgl.dll ci-mesa/
          ldd ci-mesa/*.dll | awk '{print $3}' | grep -i '^/mingw64/' | sort -u | xargs -r cp -n -t ci-mesa/

      - uses: actions/upload-artifact@v4
        with:
          name: ci-mesa
          path: ci-mesa/
          retention-days: 3

      - uses: actions/upload-artifact@v4
        with:
          name: PokeVerse-Windows-Dev
          path: dist/
          if-no-files-found: error
          compression-level: 9

      - name: Assemble live client package
        env:
          LIVE_HOST: ${{ vars.LIVE_SERVER_HOST || secrets.LIVE_SERVER_HOST || vars.OVH_HOST || secrets.OVH_HOST || '40.160.145.24' }}
        run: scripts/package-windows-live-client.sh build/client "$LIVE_HOST" dist-live

      - uses: actions/upload-artifact@v4
        with:
          name: PokeVerse-Windows-Live
          path: dist-live/
          if-no-files-found: error
          compression-level: 9

  redemption-windows:
    name: Build Redemption client (Windows)
    runs-on: windows-2025-vs2026
    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg-cache,readwrite
    defaults:
      run:
        working-directory: core/client-redemption
    steps:
      - uses: actions/checkout@v4

      - name: vcpkg baseline
        shell: pwsh
        run: |
          $json = Get-Content vcpkg.json -Raw | ConvertFrom-Json
          "VCPKG_COMMIT=$($json.'builtin-baseline')" | Out-File -FilePath $env:GITHUB_ENV -Append
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\vcpkg-cache" | Out-Null

      # same cache key as the Client release workflow, so both reuse the built libraries
      - uses: actions/cache/restore@v4
        with:
          path: vcpkg-cache
          key: vcpkg-windows-${{ hashFiles('core/client-redemption/vcpkg.json', 'core/client-redemption/cmake/triplets/**') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-windows-${{ hashFiles('core/client-redemption/vcpkg.json', 'core/client-redemption/cmake/triplets/**') }}-
            vcpkg-windows-

      - uses: ilammy/msvc-dev-cmd@v1

      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}

      - name: Build
        shell: pwsh
        run: |
          cmake --preset windows-release -DTOGGLE_BIN_FOLDER=ON -DOPTIONS_ENABLE_IPO=OFF -DOPTIONS_ENABLE_SCCACHE=OFF `
            "-DBUILD_COMMIT=$($env:GITHUB_SHA.Substring(0,7))" "-DBUILD_REVISION=$env:GITHUB_RUN_NUMBER"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build --preset windows-release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\bin-windows" | Out-Null
          Copy-Item build\windows-release\bin\*.exe "$env:GITHUB_WORKSPACE\bin-windows\"
          Get-ChildItem build\windows-release\bin\*.dll -ErrorAction SilentlyContinue | Copy-Item -Destination "$env:GITHUB_WORKSPACE\bin-windows\"

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: vcpkg-cache
          key: vcpkg-windows-${{ hashFiles('core/client-redemption/vcpkg.json', 'core/client-redemption/cmake/triplets/**') }}-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        with:
          name: redemption-windows-bin
          path: bin-windows/
          if-no-files-found: error

  dev-client:
    name: Add the Redemption client to the dev package
    needs: [build, redemption-windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/download-artifact@v4
        with:
          name: PokeVerse-Windows-Dev
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: redemption-windows-bin
          path: bin-windows

      # modern layout, 127.0.0.1:7564, no updater
      - name: Assemble
        run: scripts/assemble-redemption-client.sh --host 127.0.0.1 dist/PokeVerse-Windows-Dev/client-windows bin-windows/*

      - uses: actions/upload-artifact@v4
        with:
          name: PokeVerse-Windows-Dev
          path: dist/
          if-no-files-found: error
          compression-level: 9
          overwrite: true

  test-package:
    name: Test package on a clean Windows runner
    needs: dev-client
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Get test scripts only
        uses: actions/checkout@v4
        with:
          path: repo
          sparse-checkout: scripts
          sparse-checkout-cone-mode: true

      - uses: actions/download-artifact@v4
        with:
          name: PokeVerse-Windows-Dev
          path: ${{ runner.temp }}\download

      - uses: actions/download-artifact@v4
        with:
          name: ci-mesa
          path: ${{ runner.temp }}\ci-mesa

      - name: Run end-to-end test from the extracted package
        shell: pwsh
        run: |
          $pkg = Join-Path $env:RUNNER_TEMP "download\PokeVerse-Windows-Dev"
          python repo\scripts\test-package-windows.py $pkg --logs (Join-Path $env:RUNNER_TEMP "test-logs") --mesa (Join-Path $env:RUNNER_TEMP "ci-mesa")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-logs-windows
          path: ${{ runner.temp }}\test-logs

  test-server-linux:
    name: Server test (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++ pkg-config \
            libboost-system-dev libboost-filesystem-dev libboost-thread-dev libboost-regex-dev \
            liblua5.1-0-dev libgmp-dev libsqlite3-dev libmariadb-dev libxml2-dev libssl-dev \
            mariadb-server lua5.1
          sudo systemctl stop mariadb || true
      - name: Build server
        run: |
          cmake -S core/server -B build/server -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/server
      - name: Test
        run: scripts/test-server-linux.sh build/server/pokeverse-server
