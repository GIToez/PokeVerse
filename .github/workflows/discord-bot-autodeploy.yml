name: Discord bot auto-deploy

# Deploys the production Discord bot when PokeVerse-Discord main has a commit that is not
# live yet. A push to PokeVerse-Discord main starts this workflow through workflow_dispatch
# (a token with only Actions: write on this repository, kept in PokeVerse-Discord); the
# midnight and noon schedule only catches a push whose dispatch failed. The check runs
# without the production environment; only a new bot commit starts the deploy job (which
# waits for the environment's reviewers, if any).
# Deployed commits are remembered as "discord-bot-deployed-<sha7>" cache entries, also written
# by the Live server workflow when it deploys the bot. Only the bot restarts, never the game.
# Setup: docs/live-server.md

on:
  # 00:10 and 12:10 server time, just after the midnight restart. Cron is UTC only, so both
  # daylight-saving offsets are scheduled and the window job drops the one that is off.
  schedule:
    - cron: "10 7,8,19,20 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  window:
    name: Time window
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.window.outputs.run }}
    steps:
      - id: window
        env:
          TZ: ${{ vars.LIVE_TIMEZONE || 'America/Los_Angeles' }}
        run: |
          hour=$(date +%H)
          run=true
          if [ "${{ github.event_name }}" = schedule ] && [ "$hour" != 00 ] && [ "$hour" != 12 ]; then
            run=false
            echo "It is $(date '+%H:%M %Z'), not the midnight or noon check: skipping." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  check:
    name: Check PokeVerse-Discord main
    needs: window
    if: needs.window.outputs.run == 'true'
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.bot.outputs.sha }}
      commit: ${{ steps.bot.outputs.commit }}
      deployed: ${{ steps.marker.outputs.cache-hit }}
      live-busy: ${{ steps.live.outputs.busy }}
    steps:
      - name: Bot main commit
        id: bot
        env:
          REPO_TOKEN: ${{ secrets.PV_REPOS_TOKEN }}
        run: |
          url=https://github.com/GIToez/PokeVerse-Discord.git
          [ -z "$REPO_TOKEN" ] || url="https://x-access-token:$REPO_TOKEN@github.com/GIToez/PokeVerse-Discord.git"
          commit=$(git ls-remote "$url" refs/heads/main | cut -f1)
          [ -n "$commit" ] || { echo "::error::could not read PokeVerse-Discord main"; exit 1; }
          sha=${commit::7}
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          mkdir -p .bot-deployed && echo "$sha" > .bot-deployed/sha

      - name: Already deployed?
        id: marker
        uses: actions/cache/restore@v4
        with:
          path: .bot-deployed
          key: discord-bot-deployed-${{ steps.bot.outputs.sha }}
          lookup-only: true

      # Both workflows share the live-server-ovh concurrency group, where a newer pending job
      # cancels the older one, so a bot deploy queued here would cancel a waiting Live deploy.
      # The Live server deploy installs the bot too.
      - name: Live server run active?
        id: live
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          busy=false
          for status in queued in_progress waiting pending requested; do
            n=$(gh api "repos/${{ github.repository }}/actions/workflows/live-server.yml/runs?status=$status&per_page=1" --jq .total_count)
            [ "$n" -gt 0 ] && busy=true
          done
          echo "busy=$busy" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          if [ "${{ steps.marker.outputs.cache-hit }}" = true ]; then
            echo "Bot ${{ steps.bot.outputs.sha }} is already live." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.live.outputs.busy }}" = true ]; then
            echo "Bot ${{ steps.bot.outputs.sha }} is new, but a Live server run is active: skipping." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Bot ${{ steps.bot.outputs.sha }} is new: deploying." >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    name: Deploy the Discord bot
    needs: check
    if: needs.check.outputs.deployed != 'true' && needs.check.outputs.live-busy != 'true'
    runs-on: ubuntu-24.04
    environment: ${{ vars.DISCORD_AUTODEPLOY_ENVIRONMENT || 'production' }}
    concurrency:
      group: live-server-ovh
      cancel-in-progress: false
    timeout-minutes: 30
    env:
      ACTION: discord-deploy
      PV_HOST: ${{ vars.OVH_HOST || secrets.OVH_HOST || '40.160.145.24' }}
      PV_SSH_PORT: ${{ vars.OVH_SSH_PORT || secrets.OVH_SSH_PORT || '22' }}
      PV_SSH_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      PV_SSH_KEY_PASSPHRASE: ${{ secrets.OVH_SSH_KEY_PASSPHRASE }}
      PV_SSH_HOST_KEY: ${{ secrets.OVH_SSH_HOST_KEY }}
      PV_PUBLIC_HOST: ${{ vars.LIVE_SERVER_HOST || secrets.LIVE_SERVER_HOST || vars.OVH_HOST || secrets.OVH_HOST || '40.160.145.24' }}
      PV_DAILY_RESTART: ${{ vars.LIVE_DAILY_RESTART || secrets.LIVE_DAILY_RESTART || 'true' }}
      PV_DAILY_TIME: ${{ vars.LIVE_DAILY_RESTART_TIME || secrets.LIVE_DAILY_RESTART_TIME || '06:00' }}
      PV_TIMEZONE: ${{ vars.LIVE_TIMEZONE || secrets.LIVE_TIMEZONE }}
      DISCORD_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_APPLICATION_ID: ${{ vars.DISCORD_APPLICATION_ID || secrets.DISCORD_APPLICATION_ID }}
      DISCORD_GUILD_ID: ${{ vars.DISCORD_GUILD_ID || secrets.DISCORD_GUILD_ID }}
      DISCORD_ADMIN_USER_IDS: ${{ vars.DISCORD_ADMIN_USER_IDS || secrets.DISCORD_ADMIN_USER_IDS }}
      DISCORD_ADMIN_ROLE_IDS: ${{ vars.DISCORD_ADMIN_ROLE_IDS || secrets.DISCORD_ADMIN_ROLE_IDS }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
          sparse-checkout-cone-mode: true

      - name: Check GitHub secrets and variables
        run: scripts/live/check-settings.sh

      - uses: actions/checkout@v4
        with:
          repository: GIToez/PokeVerse-Discord
          ref: ${{ needs.check.outputs.commit }}
          path: bot
          token: ${{ secrets.PV_REPOS_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build and package
        working-directory: bot
        run: |
          npm ci
          npm run package:linux
          release="$(date -u +%Y%m%d-%H%M%S)-$(git rev-parse --short=7 HEAD)"
          mkdir -p ../packages
          cp builds/production/pokeverse-discord-linux-x64.tar.gz ../packages/
          echo "$release" > ../packages/bot-release.txt
          echo "Discord bot release: $release" >> "$GITHUB_STEP_SUMMARY"

      - name: Run discord-deploy
        run: |
          export PV_BOT_PACKAGE=$PWD/packages/pokeverse-discord-linux-x64.tar.gz
          PV_BOT_RELEASE=$(cat packages/bot-release.txt)
          export PV_BOT_RELEASE
          scripts/live/deploy.sh discord-deploy

      - name: Remember the deployed commit
        run: mkdir -p .bot-deployed && echo "${{ needs.check.outputs.sha }}" > .bot-deployed/sha

      - uses: actions/cache/save@v4
        with:
          path: .bot-deployed
          key: discord-bot-deployed-${{ needs.check.outputs.sha }}
