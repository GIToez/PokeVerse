name: Client release

# Builds the Redemption client for Windows, Linux and Android, assembles the live packages and the
# updater site. When started by hand with "publish", it publishes to the public
# GIToez/PokeVerse-Clients repository: a release (large files and the first-install
# downloads) and its gh-pages site (the website, the updater manifests and files).
# Clients that are already installed then update themselves on start. This repository
# can be private. Setup: docs/client-updates.md

# Pull requests check the build; main is only built when publishing, so merges do not
# build the same thing twice.
on:
  pull_request:
    paths:
      - core/client-redemption/**
      - core/client-legacy/data/**
      - core/client-legacy/modules/**
      - scripts/assemble-redemption-client.sh
      - scripts/encrypt-client.py
      - scripts/set-client-server.sh
      - scripts/make-updater-manifest.py
      - scripts/build-android-client.sh
      - scripts/mapper/pvmap.py
      - scripts/mapper/render.py
      - scripts/mapper/render_pokepedia.py
      - scripts/mapper/hidden-regions.txt
      - core/server/data/world/map.otbm
      - core/server/data/items/items.otb
      - .github/workflows/client-release.yml
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the release and the update to players
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

env:
  CLIENTS_REPO: GIToez/PokeVerse-Clients
  # the Pages custom domain; the github.io address only 301-redirects here, one more TLS handshake
  PAGES_URL: https://pokeverse.quest
  VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg-cache,readwrite
  # encrypts the modules, images and sprites (scripts/encrypt-client.py) and builds the clients that
  # read them; without it (forks' pull requests) the clients are built unencrypted
  PV_ENCRYPTION_KEY: ${{ secrets.CLIENT_ENCRYPTION_KEY }}

jobs:
  linux:
    name: Build (Linux)
    # the binary needs at least the glibc it was built against, so build on an older
    # system (glibc 2.35) to run on Ubuntu 22.04, Mint 21, Debian 12 and newer
    runs-on: ubuntu-22.04
    env:
      CC: gcc-14
      CXX: g++-14
    defaults:
      run:
        working-directory: core/client-redemption
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends autoconf autoconf-archive automake \
            gcc-14 g++-14 libgl1-mesa-dev libglu1-mesa-dev libltdl-dev libtool libtool-bin \
            libx11-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev linux-libc-dev \
            make ninja-build perl pkg-config

      - name: vcpkg baseline
        run: |
          echo "VCPKG_COMMIT=$(python3 -c 'import json;print(json.load(open("vcpkg.json"))["builtin-baseline"])')" >> "$GITHUB_ENV"
          mkdir -p "$GITHUB_WORKSPACE/vcpkg-cache"

      - uses: actions/cache/restore@v4
        id: vcpkg-cache
        with:
          path: vcpkg-cache
          key: vcpkg-linux2204-${{ hashFiles('core/client-redemption/vcpkg.json', 'core/client-redemption/cmake/triplets/**') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-linux2204-${{ hashFiles('core/client-redemption/vcpkg.json', 'core/client-redemption/cmake/triplets/**') }}-
            vcpkg-linux2204-

      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}

      - name: Build
        run: |
          # GCC 14's C++ runtime is linked in; players' systems have an older libstdc++
          cmake --preset linux-release -DTOGGLE_BIN_FOLDER=ON -DOPTIONS_ENABLE_IPO=OFF -DOPTIONS_ENABLE_CCACHE=OFF \
            "-DCMAKE_EXE_LINKER_FLAGS=-static-libstdc++ -static-libgcc" \
            "-DBUILD_COMMIT=${GITHUB_SHA::7}" "-DBUILD_REVISION=${GITHUB_RUN_NUMBER}" \
            "-DPV_ENCRYPTION_KEY=${PV_ENCRYPTION_KEY}"
          cmake --build --preset linux-release
          mkdir -p "$GITHUB_WORKSPACE/bin-linux"
          cp build/linux-release/bin/otclient "$GITHUB_WORKSPACE/bin-linux/PokeVerse"
          strip "$GITHUB_WORKSPACE/bin-linux/PokeVerse"

      - name: Check the system libraries it needs
        run: |
          bin="$GITHUB_WORKSPACE/bin-linux/PokeVerse"
          versions=$(objdump -T "$bin" | grep -oE '(GLIBC|GLIBCXX|CXXABI)_[0-9.]+' | sort -u -V)
          echo "$versions"
          glibc=$(echo "$versions" | grep '^GLIBC_' | sed 's/GLIBC_//' | sort -V | tail -1)
          if echo "$versions" | grep -q '^GLIBCXX_\|^CXXABI_'; then
            echo "::error::PokeVerse still needs the system libstdc++"; exit 1
          fi
          if [ "$(printf '%s\n' "$glibc" 2.35 | sort -V | tail -1)" != 2.35 ]; then
            echo "::error::PokeVerse needs glibc $glibc, newer than 2.35"; exit 1
          fi
          echo "Needs glibc $glibc or newer"

      # saved even when the build fails, so the libraries built so far are not lost; not saved again
      # after a restore for the same vcpkg.json, or every run adds another full copy and the
      # repository's 10 GB of caches pushes out the others (the map pictures)
      - uses: actions/cache/save@v4
        if: always() && !startsWith(steps.vcpkg-cache.outputs.cache-matched-key, format('vcpkg-linux2204-{0}-', hashFiles('core/client-redemption/vcpkg.json', 'core/client-redemption/cmake/triplets/**')))
        with:
          path: vcpkg-cache
          key: vcpkg-linux2204-${{ hashFiles('core/client-redemption/vcpkg.json', 'core/client-redemption/cmake/triplets/**') }}-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        with:
          name: redemption-linux-bin
          retention-days: 1
          path: bin-linux/
          if-no-files-found: error

  windows:
    name: Build (Windows)
    runs-on: windows-2025-vs2026
    defaults:
      run:
        working-directory: core/client-redemption
    steps:
      - uses: actions/checkout@v4

      - name: vcpkg baseline
        shell: pwsh
        run: |
          $json = Get-Content vcpkg.json -Raw | ConvertFrom-Json
          "VCPKG_COMMIT=$($json.'builtin-baseline')" | Out-File -FilePath $env:GITHUB_ENV -Append
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\vcpkg-cache" | Out-Null

      - uses: actions/cache/restore@v4
        id: vcpkg-cache
        with:
          path: vcpkg-cache
          key: vcpkg-windows-${{ hashFiles('core/client-redemption/vcpkg.json', 'core/client-redemption/cmake/triplets/**') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-windows-${{ hashFiles('core/client-redemption/vcpkg.json', 'core/client-redemption/cmake/triplets/**') }}-
            vcpkg-windows-

      - uses: ilammy/msvc-dev-cmd@v1

      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}

      - name: Build
        shell: pwsh
        run: |
          cmake --preset windows-release -DTOGGLE_BIN_FOLDER=ON -DOPTIONS_ENABLE_IPO=OFF -DOPTIONS_ENABLE_SCCACHE=OFF `
            "-DBUILD_COMMIT=$($env:GITHUB_SHA.Substring(0,7))" "-DBUILD_REVISION=$env:GITHUB_RUN_NUMBER" `
            "-DPV_ENCRYPTION_KEY=$env:PV_ENCRYPTION_KEY"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build --preset windows-release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\bin-windows" | Out-Null
          Copy-Item build\windows-release\bin\*.exe "$env:GITHUB_WORKSPACE\bin-windows\"
          Rename-Item "$env:GITHUB_WORKSPACE\bin-windows\otclient.exe" PokeVerse.exe
          Get-ChildItem build\windows-release\bin\*.dll -ErrorAction SilentlyContinue | Copy-Item -Destination "$env:GITHUB_WORKSPACE\bin-windows\"

      # saved even when the build fails, so the libraries built so far are not lost; not saved again
      # after a restore for the same vcpkg.json, or every run adds another full copy and the
      # repository's 10 GB of caches pushes out the others (the map pictures)
      - uses: actions/cache/save@v4
        if: always() && !startsWith(steps.vcpkg-cache.outputs.cache-matched-key, format('vcpkg-windows-{0}-', hashFiles('core/client-redemption/vcpkg.json', 'core/client-redemption/cmake/triplets/**')))
        with:
          path: vcpkg-cache
          key: vcpkg-windows-${{ hashFiles('core/client-redemption/vcpkg.json', 'core/client-redemption/cmake/triplets/**') }}-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        with:
          name: redemption-windows-bin
          retention-days: 1
          path: bin-windows/
          if-no-files-found: error

      # RelWithDebInfo writes otclient.pdb next to the exe: the module+offset lines of a crash
      # report are looked up against the one from the same run
      - uses: actions/upload-artifact@v4
        with:
          name: redemption-windows-pdb
          retention-days: 14
          path: core/client-redemption/build/windows-release/bin/*.pdb
          if-no-files-found: warn

  android:
    name: Build (Android)
    runs-on: ubuntu-24.04
    env:
      LIVE_HOST: ${{ vars.LIVE_SERVER_HOST || vars.OVH_HOST || '40.160.145.24' }}
      OTCLIENT_ANDROID_ABIS: arm64-v8a
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: ndk;29.0.13599879 cmake;3.22.1 platforms;android-36

      # private repositories get smaller runners: the unity C++ files compiled in parallel run
      # out of memory and the runner dies ("The operation was canceled"). The swap needs disk,
      # so the preinstalled tools this job doesn't use are removed first.
      - name: Disk and swap for the compiler
        run: |
          df -h / /mnt || true
          free -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/node_modules /opt/ghc /usr/local/.ghcup \
            /usr/local/share/boost /usr/local/share/powershell /usr/local/share/chromium \
            /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go /opt/hostedtoolcache/PyPy \
            /usr/share/swift /usr/local/julia* /opt/az /opt/microsoft || true
          sudo docker image prune -af > /dev/null 2>&1 || true
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          df -h / || true
          free -h

      - name: vcpkg baseline
        run: |
          echo "VCPKG_COMMIT=$(python3 -c 'import json;print(json.load(open("core/client-redemption/vcpkg.json"))["builtin-baseline"])')" >> "$GITHUB_ENV"
          mkdir -p "$GITHUB_WORKSPACE/vcpkg-cache"

      - uses: actions/cache/restore@v4
        id: vcpkg-cache
        with:
          path: vcpkg-cache
          key: vcpkg-android-${{ hashFiles('core/client-redemption/vcpkg.json', 'core/client-redemption/cmake/triplets/**') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-android-${{ hashFiles('core/client-redemption/vcpkg.json', 'core/client-redemption/cmake/triplets/**') }}-
            vcpkg-android-

      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}

      # Players can only install a newer APK over an older one when both have the same
      # signature, so releases need the PokeVerse key; without it the APK is debug-signed.
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "RELEASE_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; the APK is debug-signed"
          fi

      - name: Build
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          OTCLIENT_VERSION_CODE: ${{ github.run_number }}
          OTCLIENT_VERSION_NAME: client-${{ github.run_number }}
          DISCORD_URL: ${{ vars.DISCORD_INVITE_URL || 'https://discord.gg/P88WNBB56E' }}
        run: |
          export OTCLIENT_BUILD_COMMIT=${GITHUB_SHA::7}
          scripts/build-android-client.sh --host "$LIVE_HOST" --updater "$PAGES_URL/updater/" \
            --discord "$DISCORD_URL" bin-android/PokeVerse-Android.apk

      # saved even when the build fails, so the libraries built so far are not lost; not saved again
      # after a restore for the same vcpkg.json, or every run adds another full copy and the
      # repository's 10 GB of caches pushes out the others (the map pictures)
      - uses: actions/cache/save@v4
        if: always() && !startsWith(steps.vcpkg-cache.outputs.cache-matched-key, format('vcpkg-android-{0}-', hashFiles('core/client-redemption/vcpkg.json', 'core/client-redemption/cmake/triplets/**')))
        with:
          path: vcpkg-cache
          key: vcpkg-android-${{ hashFiles('core/client-redemption/vcpkg.json', 'core/client-redemption/cmake/triplets/**') }}-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        with:
          name: redemption-android-apk
          retention-days: 1
          path: bin-android/
          if-no-files-found: error
          compression-level: 0

  package:
    name: Packages and updater site
    needs: [linux, windows, android]
    # a failed Linux build (its toolchain PPA goes down) does not hold back Windows and Android:
    # the Linux package then keeps the engine of the last published release, with the new files
    if: always() && needs.windows.result == 'success' && needs.android.result == 'success' && contains(fromJSON('["success", "failure"]'), needs.linux.result)
    runs-on: ubuntu-24.04
    env:
      LIVE_HOST: ${{ vars.LIVE_SERVER_HOST || vars.OVH_HOST || '40.160.145.24' }}
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/download-artifact@v4
        if: needs.linux.result == 'success'
        with:
          name: redemption-linux-bin
          path: bin-linux

      - name: Previous Linux engine
        if: needs.linux.result != 'success'
        run: |
          mkdir -p bin-linux "$RUNNER_TEMP/linux-prev"
          curl -fsSL --retry 5 -o "$RUNNER_TEMP/linux-prev.tar.gz" \
            "https://github.com/$CLIENTS_REPO/releases/latest/download/PokeVerse-Linux.tar.gz"
          tar -xzf "$RUNNER_TEMP/linux-prev.tar.gz" -C "$RUNNER_TEMP/linux-prev" PokeVerse/PokeVerse
          mv "$RUNNER_TEMP/linux-prev/PokeVerse/PokeVerse" bin-linux/PokeVerse
          echo "::warning::The Linux build failed, so the Linux package keeps the engine of the last release"
          echo "The Linux build failed: the Linux package keeps the engine of the last release, with this release's files" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/download-artifact@v4
        with:
          name: redemption-windows-bin
          path: bin-windows

      - uses: actions/download-artifact@v4
        with:
          name: redemption-android-apk
          path: bin-android

      - name: Version
        id: version
        run: echo "tag=client-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Encryption key
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        run: |
          [ -n "$PV_ENCRYPTION_KEY" ] || { echo "::error::Add the CLIENT_ENCRYPTION_KEY secret: published clients are encrypted"; exit 1; }

      # the Pokepedia's pictures of the map, rendered again only when the map, the items, the sprites
      # or the hidden regions change; after a change the last render is restored and only the pieces
      # that changed are drawn again. scripts/assemble-redemption-client.sh adds them to the packages.
      # Only main saves it: a pull request's caches can't be read from main, so a render saved
      # there would be drawn again in full by the next release
      - name: Map pictures cache
        id: map-pictures
        uses: actions/cache/restore@v4
        with:
          path: |
            build/map-pictures
            build/map-pictures-state.json
          key: map-pictures-${{ hashFiles('core/server/data/world/map.otbm', 'core/server/data/items/items.otb', 'core/client-legacy/data/things/data.dat', 'core/client-legacy/data/things/data.spr', 'scripts/mapper/pvmap.py', 'scripts/mapper/render.py', 'scripts/mapper/render_pokepedia.py', 'scripts/mapper/hidden-regions.txt') }}
          restore-keys: map-pictures-

      - name: Render map pictures
        if: steps.map-pictures.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-pil
          python3 scripts/mapper/render_pokepedia.py --jobs "$(nproc)"

      - uses: actions/cache/save@v4
        if: steps.map-pictures.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        with:
          path: |
            build/map-pictures
            build/map-pictures-state.json
          key: map-pictures-${{ hashFiles('core/server/data/world/map.otbm', 'core/server/data/items/items.otb', 'core/client-legacy/data/things/data.dat', 'core/client-legacy/data/things/data.spr', 'scripts/mapper/pvmap.py', 'scripts/mapper/render.py', 'scripts/mapper/render_pokepedia.py', 'scripts/mapper/hidden-regions.txt') }}

      - name: Assemble live packages
        env:
          DISCORD_URL: ${{ vars.DISCORD_INVITE_URL || 'https://discord.gg/P88WNBB56E' }}
        run: |
          chmod +x bin-linux/PokeVerse
          live=(--host "$LIVE_HOST" --updater "$PAGES_URL/updater/" --discord "$DISCORD_URL")
          scripts/assemble-redemption-client.sh "${live[@]}" pkg/windows bin-windows/*
          scripts/assemble-redemption-client.sh "${live[@]}" pkg/linux bin-linux/PokeVerse \
            core/client-redemption/packaging/linux/PokeVerse.sh core/client-redemption/packaging/linux/PokeVerse.desktop
          # what the APK unpacks on first start; the engine itself comes with the APK
          scripts/assemble-redemption-client.sh "${live[@]}" pkg/android

      - name: Updater site
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # site/ becomes PokeVerse-Clients gh-pages. Each release's files get their own folder:
          # Pages caches every URL for 10 minutes (ignoring query strings), so a file changed at
          # the same URL can come back stale and fail its checksum
          common=(--site site/updater --files-dir "site/updater/files/$TAG"
                  --files-url "$PAGES_URL/updater/files/$TAG" --version "$TAG"
                  --release-dir release --release-url "https://github.com/$CLIENTS_REPO/releases/download/$TAG")
          python3 scripts/make-updater-manifest.py --package pkg/windows --os windows --binary PokeVerse.exe "${common[@]}"
          python3 scripts/make-updater-manifest.py --package pkg/linux --os linux --binary PokeVerse "${common[@]}"
          python3 scripts/make-updater-manifest.py --package pkg/android --os android "${common[@]}" \
            --apk bin-android/PokeVerse-Android.apk \
            --apk-url "https://github.com/$CLIENTS_REPO/releases/download/$TAG/PokeVerse-Android.apk"
          du -sh site release

      # the PokeVerse-Clients site is the website too: its pages sit next to updater/. Its map
      # page gets the tiles of the map pictures above, so each release publishes the current map
      - name: Website
        env:
          TAG: ${{ steps.version.outputs.tag }}
          DISCORD_URL: ${{ vars.DISCORD_INVITE_URL || 'https://discord.gg/P88WNBB56E' }}
          PAGES_DOMAIN: ${{ vars.PAGES_DOMAIN || 'pokeverse.quest' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends lua5.1 python3-pil
          python3 website/build.py --out site --downloads-repo "$CLIENTS_REPO" --release-tag "$TAG" \
            --discord-url "$DISCORD_URL" --cname "$PAGES_DOMAIN" --map build/map-pictures

      - name: Check the updater URLs
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          for os in windows linux android; do
            # init.lua is encrypted
            python3 scripts/encrypt-client.py --cat "pkg/$os/init.lua" | grep -q "^  updater = \"$PAGES_URL/updater/\","
            python3 - "$os" <<'EOF'
          import json, os, sys
          name = sys.argv[1]
          pages, repo = os.environ["PAGES_URL"], os.environ["CLIENTS_REPO"]
          m = json.load(open(f"site/updater/{name}.json"))
          assert m["url"] == f"{pages}/updater/files/{os.environ['TAG']}", m["url"]
          for url in m["urls"].values():
              assert url.startswith(f"https://github.com/{repo}/releases/download/"), url
          if name == "android":
              assert m["apk"]["url"] == f"https://github.com/{repo}/releases/download/{os.environ['TAG']}/PokeVerse-Android.apk", m["apk"]
              print(f"android: engine {m['apk']['engine']}")
          print(f"{name}: the manifest points at {pages} and the {repo} releases")
          EOF
          done

      # the same files as the zip, installed into the player's own folder (no administrator
      # rights), so the updater keeps working afterwards
      - name: Windows installer
        run: |
          sudo apt-get install -y --no-install-recommends nsis
          # an absolute script path: makensis runs from the script's folder, so ${__FILEDIR__} must not be relative
          makensis -V2 -DSOURCE="$PWD/pkg/windows" -DOUTFILE="$PWD/release/PokeVerse-Setup.exe" \
            "$PWD/core/client-redemption/packaging/windows/PokeVerse.nsi"

      - name: First-install downloads
        run: |
          (cd pkg && mv windows PokeVerse && zip -qr ../release/PokeVerse-Windows.zip PokeVerse && mv PokeVerse windows)
          (cd pkg && mv linux PokeVerse && tar -czf ../release/PokeVerse-Linux.tar.gz PokeVerse && mv PokeVerse linux)
          cp bin-android/PokeVerse-Android.apk release/
          ls -la release

      - uses: actions/upload-artifact@v4
        with:
          name: client-release
          retention-days: 1
          path: release/
          compression-level: 0

      - uses: actions/upload-artifact@v4
        with:
          name: clients-site
          retention-days: 1
          path: site/
          compression-level: 0

      # a dry-run push needs write access, so a token that cannot publish fails here
      # instead of halfway through publishing
      - name: Check access to PokeVerse-Clients
        env:
          REPO_TOKEN: ${{ secrets.PV_REPOS_TOKEN }}
          PUBLISHING: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        run: |
          if [ -z "$REPO_TOKEN" ]; then
            msg="PV_REPOS_TOKEN is not set, so the release cannot be published to $CLIENTS_REPO"
            if [ "$PUBLISHING" = true ]; then echo "::error::$msg"; exit 1; fi
            echo "::warning::$msg"; exit 0
          fi
          git init -q "$RUNNER_TEMP/access"
          cd "$RUNNER_TEMP/access"
          git -c user.name=check -c user.email=check@localhost commit -q --allow-empty -m check
          git push --dry-run "https://x-access-token:$REPO_TOKEN@github.com/$CLIENTS_REPO.git" HEAD:refs/heads/access-check
          echo "PV_REPOS_TOKEN can push to $CLIENTS_REPO" >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish release and update
    needs: package
    if: always() && needs.package.result == 'success' && github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # the Website workflow also replaces PokeVerse-Clients gh-pages
    concurrency:
      group: pokeverse-clients-pages
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: client-release
          path: release

      - uses: actions/download-artifact@v4
        with:
          name: clients-site
          path: clients-site

      # Release assets first: the manifests point at them. Each step skips or redoes what an
      # earlier attempt already published, so "Re-run failed jobs" is safe.
      - name: PokeVerse-Clients release
        env:
          GH_TOKEN: ${{ secrets.PV_REPOS_TOKEN }}
          TAG: ${{ needs.package.outputs.tag }}
        run: |
          gh release view "$TAG" --repo "$CLIENTS_REPO" >/dev/null 2>&1 ||
          gh release create "$TAG" release/* --repo "$CLIENTS_REPO" \
            --title "PokeVerse client $TAG" \
            --notes "Installed clients update themselves on start. New players: download PokeVerse-Setup.exe (or PokeVerse-Windows.zip to unzip it yourself), PokeVerse-Linux.tar.gz or PokeVerse-Android.apk."

      # gh-pages holds only the latest site: a new single-commit branch replaces it each
      # release, so old game files do not pile up in the repository
      - name: PokeVerse-Clients site
        env:
          REPO_TOKEN: ${{ secrets.PV_REPOS_TOKEN }}
          TAG: ${{ needs.package.outputs.tag }}
        run: |
          # The previous release's files stay one more release: for up to 10 minutes the Pages
          # cache can still hand out the old manifest, and it must find the files it lists
          if git clone -q --depth 1 --branch gh-pages "https://x-access-token:$REPO_TOKEN@github.com/$CLIENTS_REPO.git" old-site &&
             [ -f old-site/updater/windows.json ]; then
            old=$(python3 -c 'import json,os,sys; u=json.load(open(sys.argv[1]))["url"]; print(next((u[len(p):] for p in (os.environ["PAGES_URL"] + "/", "https://gitoez.github.io/PokeVerse-Clients/") if u.startswith(p)), ""))' old-site/updater/windows.json)
            case "$old" in
              updater/files|updater/files/*)
                if [ "$old" != "updater/files/$TAG" ] && [ -d "old-site/$old" ]; then
                  # --update=none: the new release's own folder (inside the old flat updater/files) wins
                  mkdir -p "clients-site/$old"
                  cp -r --update=none "old-site/$old/." "clients-site/$old/"
                  echo "Kept the previous files ($old) next to $TAG" >> "$GITHUB_STEP_SUMMARY"
                fi ;;
            esac
          fi
          rm -rf old-site
          cd clients-site
          # without it, GitHub Pages runs the branch through Jekyll
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "PokeVerse client $TAG"
          git push --force "https://x-access-token:$REPO_TOKEN@github.com/$CLIENTS_REPO.git" gh-pages

      - name: Check the PokeVerse-Clients site
        env:
          TAG: ${{ needs.package.outputs.tag }}
        run: |
          for _ in $(seq 60); do
            version=$(curl -fsSL "$PAGES_URL/updater/windows.json?t=$(date +%s)" 2>/dev/null |
                      python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])' 2>/dev/null || true)
            if [ "$version" = "$TAG" ]; then echo "$PAGES_URL serves $TAG"; exit 0; fi
            sleep 15
          done
          echo "::error::$PAGES_URL/updater/windows.json does not serve $TAG (got '${version}'). In $CLIENTS_REPO: Settings → Pages → Deploy from a branch → gh-pages, / (root)."
          exit 1
