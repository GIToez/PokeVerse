name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends lua5.1
      - run: python3 tools/validate.py
      - name: Linux package scripts (bash syntax)
        run: for f in packaging/linux/*.sh tools/package_linux.sh tools/validate_linux_package.sh tools/test_linux_package.sh tools/validate_android_apk.sh; do bash -n "$f" || exit 1; done
      - name: Windows package guard self-test and PowerShell syntax
        run: |
          tools/test_windows_package_guard.sh
          pwsh -NoProfile -Command '$e = $null; [void][System.Management.Automation.Language.Parser]::ParseFile("packaging/windows/scripts/PokeVerse-Tools.ps1", [ref]$null, [ref]$e); if ($e) { $e; exit 1 }; "PokeVerse-Tools.ps1 parses"'

  build-and-smoke:
    name: Build server + client, startup and login smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true  # client/runtime-data/data/things/Tibia.spr

      - name: Install build and runtime dependencies
        run: |
          sudo systemctl stop mysql || true
          sudo apt-get purge -y 'mysql-*' || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libboost-system-dev libboost-filesystem-dev libboost-thread-dev libboost-regex-dev \
            libxml2-dev libssl-dev liblua5.1-0-dev lua5.1 libmariadb-dev libmariadb-dev-compat libsqlite3-dev libgmp-dev \
            libphysfs-dev zlib1g-dev libglew-dev libgl1-mesa-dev libopenal-dev libvorbis-dev libogg-dev \
            mariadb-server xvfb xdotool x11-utils imagemagick

      - name: Build server
        run: tools/build_server.sh

      - name: Build client
        run: tools/build_client.sh

      - name: Harness guard (docs/CLIENT_VARIANTS.md)
        run: |
          tools/package_client.sh dist/client /tmp/pokeverse-client.tar.gz
          for var in VARIANT=harness BOT_PROTECTION_DISABLED=1 TEST_AUTOMATION_ENABLED=1; do
            if env "$var" tools/package_client.sh dist/client /tmp/x.tgz; then echo "packaged with $var"; exit 1; fi
          done
          if cmake -S client/source -B /tmp/guard -DBOT_PROTECTION=OFF -DBUILD_VARIANT=production > /tmp/guard.log 2>&1; then
            echo "CMake accepted BOT_PROTECTION=OFF for production"; exit 1
          fi
          grep -q "only allowed with BUILD_VARIANT=harness" /tmp/guard.log

      - name: Create development database
        run: |
          sudo systemctl start mariadb
          tools/setup_dev_db.sh

      - name: Windows package database script (PokeVerse-Tools.ps1 with PowerShell 7 and MariaDB)
        run: |
          sudo mariadb -e "CREATE USER IF NOT EXISTS 'pvadmin'@'127.0.0.1' IDENTIFIED BY 'pv-ci-admin'; GRANT ALL ON *.* TO 'pvadmin'@'127.0.0.1' WITH GRANT OPTION;"
          PV_DB_ADMIN_USER=pvadmin PV_DB_ADMIN_PASSWORD=pv-ci-admin tools/test_windows_db_script.sh

      - name: Server startup smoke
        run: KEEP_RUNNING=1 tools/smoke_server.sh /tmp/server-run.log

      - name: Client login smoke
        run: |
          export DISPLAY=:99
          Xvfb :99 -screen 0 1024x768x24 &
          sleep 3
          tools/smoke_login.sh player player Trainer /tmp/server-run.log

      - name: Protocol runtime test (login, GM command, save, clean shutdown, restart persistence)
        run: |
          pkill -9 -f dist/server/pokeverse-server || true
          sleep 2
          tools/protocol_smoke.sh /tmp/protocol-smoke

      - name: Upload logs and screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: |
            /tmp/server-run.log
            /tmp/smoke_client.log
            /tmp/smoke_login.png
            /tmp/protocol-smoke/
