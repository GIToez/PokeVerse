name: Platforms

# Builds, validates and packages every supported target from source (docs/DOWNLOAD_AND_RUN.md):
#   PokeVerse-Windows-Dev     Windows x64 server + Redemption client  (windows-package)
#   PokeVerse-Linux-Dev       Linux x64 server + Redemption client    (linux-client, release leg)
#   PokeVerse-Android-arm64   Android ARM64 Redemption client APK     (android-client)
# and the separate packages for comparing the two clients against one server
# (docs/CLIENT_COMPARISON.md):
#   PokeVerse-Server-Windows, PokeVerse-Redemption-Windows, PokeVerse-Legacy-Windows,
#   PokeVerse-Client-Comparison-Windows                                (windows-package)
#   PokeVerse-Server-Linux, PokeVerse-Redemption-Linux, PokeVerse-Legacy-Linux  (linux-client)
#   PokeVerse-Redemption-Android-arm64 (the same APK, named by client)  (android-client)
#   PokeVerse-Client-Comparison-Results-Windows/-Linux: screenshots, metrics, logs of the run
# Each package is validated before it is uploaded as a run artifact, then run end to end.
# A v* tag also publishes the packages to the GitHub Release of that tag (release job).
# The packages use the "development" profile (local server at 127.0.0.1, development database
# defaults); staging/production profiles become additional package jobs or matrix entries.
# The Windows server alone is also built and protocol-tested in windows-server.yml.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

env:
  POKEVERSE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.run_number) }}

# Redemption builds are long (vcpkg); queue new runs instead of cancelling a running one.
concurrency:
  group: platforms-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-client:
    name: Windows Redemption client (${{ matrix.type }})
    runs-on: windows-2025-vs2026
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        type: [release, debug]
    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-archives
      EXTRA_CMAKE_ARGS: -DOPTIONS_ENABLE_IPO=OFF -DOTCLIENT_BUILD_TESTS=OFF
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap vcpkg at the Redemption baseline
        run: |
          baseline=$(python -c "import json; print(json.load(open('client-redemption/vcpkg.json'))['builtin-baseline'])")
          git clone https://github.com/microsoft/vcpkg.git vcpkg
          git -C vcpkg checkout "$baseline"
          ./vcpkg/bootstrap-vcpkg.bat -disableMetrics
          mkdir -p vcpkg-archives

      - uses: actions/cache/restore@v4
        with:
          path: vcpkg-archives
          key: vcpkg-windows-${{ matrix.type }}-${{ hashFiles('client-redemption/vcpkg.json') }}-${{ github.run_id }}
          restore-keys: vcpkg-windows-${{ matrix.type }}-

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build Redemption with tools\windows\Build-PokeVerse-Client-Windows.bat
        shell: cmd
        run: call tools\windows\Build-PokeVerse-Client-Windows.bat ${{ matrix.type }}

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: vcpkg-archives
          key: vcpkg-windows-${{ matrix.type }}-${{ hashFiles('client-redemption/vcpkg.json') }}-${{ github.run_id }}

      - name: Stage client
        run: tools/stage_redemption.sh ${{ matrix.type }}

      - name: Packaging validation
        run: |
          if [ "${{ matrix.type }}" = release ]; then
            tools/package_client.sh dist/client-redemption dist/packages/pokeverse-client-windows-x64.tar.gz
            VARIANT=harness tools/package_client.sh dist/client-redemption /tmp/x.tgz && { echo "guard did not refuse VARIANT=harness"; exit 1; } || true
          else
            tools/package_client.sh dist/client-redemption-debug /tmp/x.tgz && { echo "debug build was packaged"; exit 1; } || true
          fi

      - name: Launch test (software OpenGL)
        id: launch
        continue-on-error: true
        shell: pwsh
        run: |
          $dir = if ("${{ matrix.type }}" -eq "release") { "dist/client-redemption" } else { "dist/client-redemption-debug" }
          $exe = Get-ChildItem "$dir/pokeverse-client*.exe" | Select-Object -First 1
          Invoke-WebRequest "https://github.com/pal1000/mesa-dist-win/releases/download/24.3.4/mesa3d-24.3.4-release-msvc.7z" -OutFile mesa.7z
          7z e mesa.7z "x64/opengl32.dll" "x64/libgallium_wgl.dll" "x64/libglapi.dll" "x64/dxil.dll" -o"$dir" -y | Out-Null
          $p = Start-Process -FilePath $exe.FullName -WorkingDirectory $dir -PassThru
          Start-Sleep -Seconds 40
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("launch-${{ matrix.type }}.png")
          if ($p.HasExited) { Write-Error "client exited with code $($p.ExitCode)"; exit 1 }
          Write-Host "client running after 40 s (pid $($p.Id))"
          Stop-Process -Id $p.Id -Force

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pokeverse-client-windows-x64-${{ matrix.type }}
          path: |
            dist/client-redemption*/
            dist/packages/
            launch-${{ matrix.type }}.png

  # Windows Redemption client against the Windows server, both built from this commit:
  # login, character list, enter game, map, 0xFF sub-protocol, walk, talk, logout.
  windows-e2e:
    name: Windows end-to-end (Redemption client + Windows server)
    needs: windows-client
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Tibia.spr LFS object id
        id: spr
        shell: bash
        run: echo "oid=$(sed -n 's/^oid sha256://p' client/runtime-data/data/things/Tibia.spr)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: spr-cache
        with:
          path: client/runtime-data/data/things/Tibia.spr
          key: tibia-spr-${{ steps.spr.outputs.oid }}
          enableCrossOsArchive: true

      - name: Fetch Tibia.spr from Git LFS (cache miss only)
        if: steps.spr-cache.outputs.cache-hit != 'true'
        shell: bash
        run: git lfs pull --include client/runtime-data/data/things/Tibia.spr

      - uses: actions/download-artifact@v4
        with:
          name: pokeverse-client-windows-x64-release

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-libxml2
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-lua51
            mingw-w64-ucrt-x86_64-libmariadbclient
            mingw-w64-ucrt-x86_64-sqlite3
            mingw-w64-ucrt-x86_64-gmp
            mingw-w64-ucrt-x86_64-python

      - name: Build server
        run: tools/build_server.sh

      - uses: shogo82148/actions-setup-mysql@v1
        with:
          distribution: mariadb
          mysql-version: "10.11"
          root-password: root

      - name: Create development database
        run: |
          MYSQL="mysql -uroot -proot -h127.0.0.1" tools/setup_dev_db.sh
          mysql -uroot -proot -h127.0.0.1 -e "CREATE USER IF NOT EXISTS 'pokeverse'@'127.0.0.1' IDENTIFIED BY 'pokeverse-dev'; GRANT ALL ON pokeverse.* TO 'pokeverse'@'127.0.0.1';"

      - name: Add game assets and software OpenGL to the client
        run: |
          dir=dist/client-redemption
          ls "$dir"/pokeverse-client.exe
          mkdir -p "$dir/data/things/854"
          cp client/runtime-data/data/things/Tibia.dat client/runtime-data/data/things/Tibia.spr "$dir/data/things/854/"
          [ "$(head -c 7 "$dir/data/things/854/Tibia.spr")" != version ] || { echo "Tibia.spr is an LFS pointer"; exit 1; }
          if [ ! -f "$dir/opengl32.dll" ]; then
            curl -fsSL -o mesa.7z https://github.com/pal1000/mesa-dist-win/releases/download/24.3.4/mesa3d-24.3.4-release-msvc.7z
            7z e mesa.7z x64/opengl32.dll x64/libgallium_wgl.dll x64/libglapi.dll x64/dxil.dll -o"$dir" -y > /dev/null
          fi

      - name: Redemption client login, gameplay smoke and logout (Trainer, GM Admin)
        timeout-minutes: 30
        run: |
          mkdir -p e2e
          KEEP_RUNNING=1 tools/smoke_server.sh e2e/server.log
          status=0
          SCREENSHOT=e2e/windows-ingame-trainer.png tools/smoke_redemption_login.sh e2e/client-trainer.log || status=1
          # A fresh database gives GM Admin no Pokemon; the Pokemon bar checks summon one and switch to the other.
          env MSYS2_ARG_CONV_EXCL='*' python3 tools/protocol_client.py enter admin admin "GM Admin" --say "/cb Charmander, 15, 10" --say "/cb Bulbasaur, 15, 10" || status=1
          PV_ACCOUNT=admin PV_PASSWORD=admin PV_CHARACTER="GM Admin" PV_EXPECT_POKEBAR=1 SCREENSHOT_AT="WALK OK" SCREENSHOT=e2e/windows-ingame-gm.png \
            tools/smoke_redemption_login.sh e2e/client-gm.log || status=1
          taskkill //F //IM pokeverse-server.exe > /dev/null 2>&1 || true
          exit $status

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-e2e
          path: e2e/
          if-no-files-found: ignore

  # Legacy client (client/source, OTClient 0.6.6 fork) for Windows, compiled from source with
  # MSYS2 UCRT64 GCC (docs/BUILD_LEGACY_WINDOWS.md); never the imported PokeJornadas binaries.
  # Production variant: bot protection on, legacy WinINet updater compiled out.
  windows-legacy-client:
    name: Windows legacy client (MSYS2 UCRT64, client/source)
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: msys2 {0}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v4

      - name: Tibia.spr LFS object id
        id: spr
        shell: bash
        run: echo "oid=$(sed -n 's/^oid sha256://p' client/runtime-data/data/things/Tibia.spr)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: spr-cache
        with:
          path: client/runtime-data/data/things/Tibia.spr
          key: tibia-spr-${{ steps.spr.outputs.oid }}
          enableCrossOsArchive: true

      - name: Fetch Tibia.spr from Git LFS (cache miss only)
        if: steps.spr-cache.outputs.cache-hit != 'true'
        shell: bash
        run: git lfs pull --include client/runtime-data/data/things/Tibia.spr

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-ccache
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-lua51
            mingw-w64-ucrt-x86_64-physfs
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-glew
            mingw-w64-ucrt-x86_64-openal
            mingw-w64-ucrt-x86_64-libvorbis
            mingw-w64-ucrt-x86_64-libogg
            mingw-w64-ucrt-x86_64-binutils

      - uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-legacy-windows-${{ github.run_id }}
          restore-keys: ccache-legacy-windows-

      - name: Build the legacy client (tools/build_client.sh, production)
        run: |
          ccache -M 2G > /dev/null
          tools/build_client.sh
          ccache -s | head -12

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .ccache
          key: ccache-legacy-windows-${{ github.run_id }}

      - name: Check the build is the legacy client and loads only shipped or Windows DLLs
        run: |
          d=dist/client
          ls -la "$d"/*.exe "$d"/*.dll
          [ "$(cat "$d/VARIANT")" = production ] || { echo "VARIANT is not production"; exit 1; }
          grep -aq Pokecenter "$d/pokeverse-client.exe" "$d/libotc_framework.dll" || { echo "no Pokecenter marker: not the legacy client"; exit 1; }
          grep -aq Redemption "$d/pokeverse-client.exe" && { echo "Redemption marker in the legacy build"; exit 1; } || true
          objdump -p "$d/pokeverse-client.exe" "$d/libotc_framework.dll" | grep -i "DLL Name" | sort -u
          objdump -p "$d/libotc_framework.dll" | grep -qi "DLL Name: wininet.dll" && { echo "the legacy updater (WinINet) is compiled in"; exit 1; } || true
          [ "$(head -c 7 "$d/data/things/Tibia.spr")" != version ] || { echo "Tibia.spr is an LFS pointer"; exit 1; }

      # Build output for the packaging job; testers download PokeVerse-Legacy-Windows instead.
      - uses: actions/upload-artifact@v4
        with:
          name: pokeverse-legacy-client-windows-x64-build
          path: dist/client/
          if-no-files-found: error
          retention-days: 7

  # PokeVerse-Windows-Dev (packaging/windows/README.txt): server built with the Windows build
  # helper, assembled with the Release client, validated (files, DLL imports, LFS assets) and
  # uploaded, then copied to "C:\PokeVerse Dev" (outside the checkout, a path with a space) and
  # driven only through its own .bat files, like a tester would.
  # The same job derives the separate packages from it (tools/package_split.sh) with the legacy
  # client build: PokeVerse-Server-Windows, PokeVerse-Redemption-Windows, PokeVerse-Legacy-Windows
  # and PokeVerse-Client-Comparison-Windows, validated, guard-tested and uploaded, then run end
  # to end from "C:\PokeVerse Comparison Test": both clients in game against one server.
  windows-package:
    name: Windows packages (PokeVerse-Windows-Dev, Server, Redemption, Legacy, Comparison)
    needs: [windows-client, windows-legacy-client]
    runs-on: windows-2025
    timeout-minutes: 150
    defaults:
      run:
        shell: msys2 {0}
    env:
      POKEVERSE_NO_PAUSE: "1"
      POKEVERSE_NONINTERACTIVE: "1"
      POKEVERSE_DB_ADMIN_USER: root
      POKEVERSE_DB_ADMIN_PASSWORD: root
    steps:
      - uses: actions/checkout@v4

      - name: Tibia.spr LFS object id
        id: spr
        shell: bash
        run: echo "oid=$(sed -n 's/^oid sha256://p' client/runtime-data/data/things/Tibia.spr)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: spr-cache
        with:
          path: client/runtime-data/data/things/Tibia.spr
          key: tibia-spr-${{ steps.spr.outputs.oid }}
          enableCrossOsArchive: true

      - name: Fetch Tibia.spr from Git LFS (cache miss only)
        if: steps.spr-cache.outputs.cache-hit != 'true'
        shell: bash
        run: git lfs pull --include client/runtime-data/data/things/Tibia.spr

      - uses: actions/download-artifact@v4
        with:
          name: pokeverse-client-windows-x64-release

      - uses: actions/download-artifact@v4
        with:
          name: pokeverse-legacy-client-windows-x64-build
          path: dist/legacy-client-windows

      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-libxml2
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-lua51
            mingw-w64-ucrt-x86_64-libmariadbclient
            mingw-w64-ucrt-x86_64-sqlite3
            mingw-w64-ucrt-x86_64-gmp
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-binutils

      - name: Build server with tools\windows\Build-PokeVerse-Server-Windows.bat
        shell: cmd
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: call tools\windows\Build-PokeVerse-Server-Windows.bat

      - name: Assemble and validate PokeVerse-Windows-Dev
        run: |
          tools/package_windows.sh dist/client-redemption dist/server dist/windows/PokeVerse-Windows-Dev
          tools/test_windows_package_guard.sh

      # Downloads as PokeVerse-Windows-Dev.zip with the PokeVerse-Windows-Dev folder inside.
      - uses: actions/upload-artifact@v4
        with:
          name: PokeVerse-Windows-Dev
          path: dist/windows/
          if-no-files-found: error

      - name: Assemble, validate and guard-test the separate packages
        run: |
          CHECK_IMPORTS=1 tools/package_split.sh windows dist/windows/PokeVerse-Windows-Dev dist/legacy-client-windows dist/split
          tools/test_split_package_guard.sh windows dist/split

      # Each downloads as <name>.zip with the package contents at the top (Extract All makes the folder).
      - uses: actions/upload-artifact@v4
        with:
          name: PokeVerse-Server-Windows
          path: dist/split/PokeVerse-Server-Windows/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: PokeVerse-Redemption-Windows
          path: dist/split/PokeVerse-Redemption-Windows/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: PokeVerse-Legacy-Windows
          path: dist/split/PokeVerse-Legacy-Windows/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: PokeVerse-Client-Comparison-Windows
          path: dist/split/PokeVerse-Client-Comparison-Windows/
          if-no-files-found: error

      - name: Copy the package outside the repository (C:\PokeVerse Dev)
        shell: pwsh
        run: |
          Copy-Item -Recurse dist\windows\PokeVerse-Windows-Dev "C:\PokeVerse Dev"
          Get-ChildItem "C:\PokeVerse Dev" | Format-Table Name, Length

      - uses: shogo82148/actions-setup-mysql@v1
        with:
          distribution: mariadb
          mysql-version: "10.11"
          root-password: root

      - name: Setup Database.bat (fresh, then again), Reset Development Database.bat
        shell: cmd
        working-directory: C:\PokeVerse Dev
        run: |
          call "Setup Database.bat" || exit /b 1
          call "Setup Database.bat" || exit /b 1
          call "Reset Development Database.bat" -Force || exit /b 1
          if not exist server\config.lua exit /b 1

      - name: Start Server and Client.bat, then the packaged client in game (Trainer, GM Admin)
        timeout-minutes: 30
        run: |
          set +e
          pkg="/c/PokeVerse Dev"
          mkdir -p e2e
          # The runner has no GPU: Mesa software OpenGL goes into this test copy only (never into the package).
          curl -fsSL -o mesa.7z https://github.com/pal1000/mesa-dist-win/releases/download/24.3.4/mesa3d-24.3.4-release-msvc.7z
          7z e mesa.7z x64/opengl32.dll x64/libgallium_wgl.dll x64/libglapi.dll x64/dxil.dll -o"$(cygpath -w "$pkg/client")" -y > /dev/null
          status=0
          # Output to a file, not a pipe: the server and client windows it starts must not hold the pipe open.
          (cd "$pkg" && env MSYS2_ARG_CONV_EXCL='*' cmd.exe /d /c "Start Server and Client.bat") > e2e/start-test.log 2>&1 || status=1
          cat e2e/start-test.log
          [ "$status" = 0 ] || echo "FAIL: Start Server and Client.bat exited non-zero"
          sleep 30
          tasklist | grep -i "pokeverse-server.exe" || { echo "FAIL: pokeverse-server.exe not running"; status=1; }
          tasklist | grep -i "pokeverse-client.exe" || { echo "FAIL: pokeverse-client.exe not running 30 s after Start Server and Client.bat"; status=1; }
          powershell -NoProfile -Command "Add-Type -AssemblyName System.Windows.Forms, System.Drawing;
            \$b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds; \$bmp = New-Object System.Drawing.Bitmap \$b.Width, \$b.Height;
            [System.Drawing.Graphics]::FromImage(\$bmp).CopyFromScreen(\$b.Location, [System.Drawing.Point]::Empty, \$b.Size);
            \$bmp.Save('$(cygpath -w "$PWD/e2e/package-launch.png")')" || true
          taskkill //F //IM pokeverse-client.exe > /dev/null 2>&1 || true
          export DIST="$pkg/client"
          SCREENSHOT=e2e/package-ingame-trainer.png tools/smoke_redemption_login.sh e2e/package-client-trainer.log || status=1
          env MSYS2_ARG_CONV_EXCL='*' python3 tools/protocol_client.py enter admin admin "GM Admin" --say "/cb Charmander, 15, 10" --say "/cb Bulbasaur, 15, 10" || status=1
          PV_ACCOUNT=admin PV_PASSWORD=admin PV_CHARACTER="GM Admin" PV_EXPECT_POKEBAR=1 SCREENSHOT_AT="WALK OK" SCREENSHOT=e2e/package-ingame-gm.png \
            tools/smoke_redemption_login.sh e2e/package-client-gm.log || status=1
          env MSYS2_ARG_CONV_EXCL='*' python3 tools/protocol_client.py enter admin admin "GM Admin" --say "/shutdown" --stay 1 || true
          for _ in $(seq 1 60); do tasklist | grep -qi pokeverse-server.exe || break; sleep 1; done
          tasklist | grep -qi pokeverse-server.exe && { echo "FAIL: server still running after /shutdown"; taskkill //F //IM pokeverse-server.exe; status=1; }
          cp -r "$pkg/server/logs" e2e/server-logs 2>/dev/null || true
          exit $status

      # The comparison package (identical parts to the separate packages) driven through its own
      # .bat files from a path with spaces; Mesa only in the throwaway copies of the client run.
      - name: Separate packages end to end (setup, one server, launchers, both clients in game, Stop Server.bat)
        timeout-minutes: 40
        run: |
          mkdir -p mesa
          7z e mesa.7z x64/opengl32.dll x64/libgallium_wgl.dll x64/libglapi.dll x64/dxil.dll -o"$(cygpath -w "$PWD/mesa")" -y > /dev/null
          MESA_DIR="$PWD/mesa" tools/test_split_packages.sh windows dist/split "$PWD/e2e/split"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PokeVerse-Client-Comparison-Results-Windows
          path: e2e/split/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-package-test
          path: e2e/
          if-no-files-found: ignore

  # PokeVerse-Android-arm64.apk: signed for development installs with the repository secret
  # POKEVERSE_ANDROID_DEV_KEYSTORE_BASE64 (+ _PASSWORD, _ALIAS) when it is set, so each build
  # installs over the previous one; otherwise with a debug key generated on the runner (a new
  # key each run: uninstall the previous build before installing). No key is ever committed.
  android-client:
    name: Android Redemption client (arm64-v8a APK)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      JAVA_VERSION: "17"
      NDK_VERSION: "29.0.13599879"
      CMAKE_VERSION: "3.22.1"
      COMPILE_SDK: "36"
      BUILD_TOOLS_VERSION: "36.0.0"
      OTCLIENT_ANDROID_ABIS: "arm64-v8a"
      LUAJIT_COMMIT: "d0e88930ddde28ff662503f9f20facf34f7265aa"
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-archives
    defaults:
      run:
        working-directory: client-redemption
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle
          cache-dependency-path: |
            client-redemption/android/**/*.gradle*
            client-redemption/android/**/gradle-wrapper.properties

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install host and Android SDK packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl g++-multilib gcc-multilib ninja-build pkg-config python3 unzip zip
          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          sdkmanager --sdk_root="$sdk_root" --install "platforms;android-${COMPILE_SDK}" \
            "build-tools;${BUILD_TOOLS_VERSION}" "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}"
          {
            echo "ANDROID_HOME=$sdk_root"
            echo "ANDROID_SDK_ROOT=$sdk_root"
            echo "ANDROID_NDK_HOME=$sdk_root/ndk/${NDK_VERSION}"
            echo "ANDROID_NDK_ROOT=$sdk_root/ndk/${NDK_VERSION}"
          } >> "$GITHUB_ENV"

      - name: Bootstrap vcpkg at the Redemption baseline
        run: |
          baseline=$(python3 -c "import json; print(json.load(open('vcpkg.json'))['builtin-baseline'])")
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout "$baseline"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      - uses: actions/cache/restore@v4
        with:
          path: vcpkg-archives
          key: vcpkg-android-arm64-${{ hashFiles('client-redemption/vcpkg.json') }}-${{ github.run_id }}
          restore-keys: vcpkg-android-arm64-

      - name: Build LuaJIT for Android
        run: |
          git clone https://github.com/LuaJIT/LuaJIT.git luajit-src
          git -C luajit-src checkout "$LUAJIT_COMMIT"
          chmod +x build_luajit_android.sh
          ./build_luajit_android.sh

      - name: Tibia.spr LFS object id
        id: spr
        working-directory: .
        run: echo "oid=$(sed -n 's/^oid sha256://p' client/runtime-data/data/things/Tibia.spr)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: spr-cache
        with:
          path: client/runtime-data/data/things/Tibia.spr
          key: tibia-spr-${{ steps.spr.outputs.oid }}
          enableCrossOsArchive: true

      - name: Fetch Tibia.spr from Git LFS (cache miss only)
        if: steps.spr-cache.outputs.cache-hit != 'true'
        working-directory: .
        run: git lfs pull --include client/runtime-data/data/things/Tibia.spr

      - name: Pack game assets into data.zip
        run: |
          mkdir -p android/app/src/main/assets
          python3 - <<'PY'
          from pathlib import Path
          import os, zipfile
          out = Path('android/app/src/main/assets/data.zip')
          # Same exclusion as tools/stage_redemption.sh: no upstream bot in PokeVerse builds.
          bot = Path('mods/game_bot')
          loader = Path('mods/client_mods/mods.otmod')
          with zipfile.ZipFile(out, 'w', zipfile.ZIP_DEFLATED) as z:
              for root in ('data', 'mods', 'modules'):
                  for p in sorted(Path(root).rglob('*')):
                      if not p.is_file() or p == bot or bot in p.parents:
                          continue
                      if p == loader:
                          lines = [l for l in p.read_text().splitlines(True) if l.strip() != '- game_bot']
                          z.writestr(p.as_posix(), ''.join(lines))
                      else:
                          z.write(p, p.as_posix())
              assert not any(n.startswith('mods/game_bot/') for n in z.namelist())
              for f in ('init.lua', 'otclientrc.lua', 'cacert.pem', 'config.ini'):
                  if Path(f).exists():
                      z.write(f, f)
              # PokeVerse 854 SPR/DAT, staged like tools/stage_redemption.sh does.
              things = Path('../client/runtime-data/data/things')
              for f in ('Tibia.dat', 'Tibia.spr'):
                  with open(things / f, 'rb') as fh:
                      assert fh.read(7) != b'version', f'{f} is a Git LFS pointer'
                  z.write(things / f, f'data/things/854/{f}')
          print(f'{out}: {out.stat().st_size} bytes')
          # A different stamp makes an updated APK replace the game data unpacked by the previous one.
          Path('android/app/src/main/assets/data_stamp.txt').write_text(f"{os.environ['GITHUB_SHA']}-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}")
          PY

      - name: Development signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.POKEVERSE_ANDROID_DEV_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.POKEVERSE_ANDROID_DEV_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.POKEVERSE_ANDROID_DEV_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/pokeverse-dev.keystore"
            {
              echo "RELEASE_KEYSTORE=$RUNNER_TEMP/pokeverse-dev.keystore"
              echo "RELEASE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "RELEASE_KEY_PASSWORD=$KEYSTORE_PASSWORD"
              echo "RELEASE_KEY_ALIAS=${KEY_ALIAS:-pokeverse-dev}"
            } >> "$GITHUB_ENV"
            echo "Signing with the repository development key"
          else
            echo "::notice::POKEVERSE_ANDROID_DEV_KEYSTORE_BASE64 is not set: the APK is signed with a per-run debug key. Uninstall the previous PokeVerse build before installing this one."
          fi

      - name: Build APK
        working-directory: client-redemption/android
        env:
          POKEVERSE_VERSION_CODE: ${{ github.run_number }}
          POKEVERSE_VERSION_NAME: ${{ env.POKEVERSE_VERSION }}
        run: |
          chmod +x gradlew
          # One retry: dl.google.com downloads (aapt2) occasionally fail on the runners.
          ./gradlew :app:assembleRelease --no-daemon --stacktrace ||
            { echo "::warning::Gradle failed; retrying once"; sleep 30; ./gradlew :app:assembleRelease --no-daemon --stacktrace; }

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: vcpkg-archives
          key: vcpkg-android-arm64-${{ hashFiles('client-redemption/vcpkg.json') }}-${{ github.run_id }}

      - name: Validate and name PokeVerse-Android-arm64.apk
        working-directory: .
        run: |
          apks=(client-redemption/android/app/build/outputs/apk/release/*.apk)
          [ ${#apks[@]} = 1 ] && [ -f "${apks[0]}" ] || { echo "expected exactly one release APK: ${apks[*]}"; exit 1; }
          mkdir -p dist/android
          cp "${apks[0]}" dist/android/PokeVerse-Android-arm64.apk
          tools/validate_android_apk.sh dist/android/PokeVerse-Android-arm64.apk
          "$(ls -1 "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)" dump badging dist/android/PokeVerse-Android-arm64.apk | head -3

      # Downloads as PokeVerse-Android-arm64.zip with PokeVerse-Android-arm64.apk inside.
      - uses: actions/upload-artifact@v4
        with:
          name: PokeVerse-Android-arm64
          path: dist/android/PokeVerse-Android-arm64.apk
          if-no-files-found: error

      # The same APK under the name that says which client it is (the legacy client has no
      # Android target: docs/CLIENT_COMPARISON.md).
      - name: Name PokeVerse-Redemption-Android-arm64.apk
        working-directory: .
        run: |
          mkdir -p dist/android-redemption
          cp dist/android/PokeVerse-Android-arm64.apk dist/android-redemption/PokeVerse-Redemption-Android-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PokeVerse-Redemption-Android-arm64
          path: dist/android-redemption/PokeVerse-Redemption-Android-arm64.apk
          if-no-files-found: error

  # Release leg: also the Linux server, the PokeVerse-Linux-Dev package (validated and uploaded
  # before the runtime tests), the repository end-to-end smoke and the package end-to-end test.
  linux-client:
    name: Linux Redemption client (${{ matrix.type }})
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        type: [release, debug]
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-archives
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf autoconf-archive automake ccache gcc-14 g++-14 \
            libgl1-mesa-dev libglu1-mesa-dev libltdl-dev libtool libtool-bin libx11-dev libxcursor-dev \
            libxi-dev libxinerama-dev libxrandr-dev linux-libc-dev make ninja-build perl pkg-config \
            xvfb xdotool imagemagick

      - name: Bootstrap vcpkg at the Redemption baseline
        run: |
          baseline=$(python3 -c "import json; print(json.load(open('client-redemption/vcpkg.json'))['builtin-baseline'])")
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout "$baseline"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      - uses: actions/cache/restore@v4
        with:
          path: vcpkg-archives
          key: vcpkg-linux-${{ matrix.type }}-${{ hashFiles('client-redemption/vcpkg.json') }}-${{ github.run_id }}
          restore-keys: vcpkg-linux-${{ matrix.type }}-

      - name: Build Redemption
        run: tools/build_redemption.sh ${{ matrix.type }}

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: vcpkg-archives
          key: vcpkg-linux-${{ matrix.type }}-${{ hashFiles('client-redemption/vcpkg.json') }}-${{ github.run_id }}

      - name: Unit tests (debug)
        if: matrix.type == 'debug'
        run: ctest --test-dir build/client-redemption/debug --output-on-failure

      - name: Stage, packaging validation, launch test
        run: |
          tools/stage_redemption.sh ${{ matrix.type }}
          dir=dist/client-redemption; [ "${{ matrix.type }}" = debug ] && dir=dist/client-redemption-debug
          if [ "${{ matrix.type }}" = release ]; then
            tools/package_client.sh "$dir" dist/packages/pokeverse-client-linux-x64.tar.gz
          elif tools/package_client.sh "$dir" /tmp/x.tgz; then
            echo "debug build was packaged"; exit 1
          fi
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x1024x24 &
          sleep 3
          (cd "$dir" && ./pokeverse-client* > /tmp/redemption.log 2>&1 &)
          for _ in $(seq 1 60); do xdotool search --name "PokeVerse" > /dev/null 2>&1 && break; sleep 1; done
          sleep 10
          import -window root launch-${{ matrix.type }}.png
          xdotool search --name "PokeVerse" > /dev/null
          pkill -9 -f pokeverse-client || true

      # End-to-end against the Linux server (release only): same smoke as windows-e2e.
      - name: Tibia.spr LFS object id
        if: matrix.type == 'release'
        id: spr
        run: echo "oid=$(sed -n 's/^oid sha256://p' client/runtime-data/data/things/Tibia.spr)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        if: matrix.type == 'release'
        id: spr-cache
        with:
          path: client/runtime-data/data/things/Tibia.spr
          key: tibia-spr-${{ steps.spr.outputs.oid }}
          enableCrossOsArchive: true

      - name: Fetch Tibia.spr from Git LFS (cache miss only)
        if: matrix.type == 'release' && steps.spr-cache.outputs.cache-hit != 'true'
        run: git lfs pull --include client/runtime-data/data/things/Tibia.spr

      - name: Build server and create the development database
        if: matrix.type == 'release'
        run: |
          sudo systemctl stop mysql || true
          sudo apt-get purge -y 'mysql-*' || true
          sudo apt-get install -y --no-install-recommends cmake \
            libboost-system-dev libboost-filesystem-dev libboost-thread-dev libboost-regex-dev \
            libxml2-dev libssl-dev liblua5.1-0-dev lua5.1 libmariadb-dev libmariadb-dev-compat libsqlite3-dev libgmp-dev \
            mariadb-server
          tools/build_server.sh
          sudo systemctl start mariadb
          tools/setup_dev_db.sh

      - name: Build the legacy client (client/source, production)
        if: matrix.type == 'release'
        run: |
          sudo apt-get install -y --no-install-recommends liblua5.1-0-dev libphysfs-dev zlib1g-dev libglew-dev \
            libopenal-dev libvorbis-dev libogg-dev libboost-chrono-dev
          tools/build_client.sh
          grep -aq Pokecenter dist/client/pokeverse-client || { echo "no Pokecenter marker: not the legacy client"; exit 1; }

      - name: Assemble and validate PokeVerse-Linux-Dev.tar.gz
        if: matrix.type == 'release'
        run: |
          tools/stage_redemption.sh release
          tools/package_linux.sh dist/client-redemption dist/server dist/linux

      # Downloads as PokeVerse-Linux-Dev.zip with PokeVerse-Linux-Dev.tar.gz inside (the tarball
      # keeps the executable bits, which artifact zips do not).
      - uses: actions/upload-artifact@v4
        if: matrix.type == 'release'
        with:
          name: PokeVerse-Linux-Dev
          path: dist/linux/PokeVerse-Linux-Dev.tar.gz
          if-no-files-found: error
          compression-level: 0

      - name: Assemble, validate and guard-test the separate Linux packages
        if: matrix.type == 'release'
        run: |
          tools/package_split.sh linux dist/linux/PokeVerse-Linux-Dev dist/client dist/split
          tools/test_split_package_guard.sh linux dist/split

      # Each downloads as <name>.zip with <name>.tar.gz inside (the tarball keeps the executable bits).
      - uses: actions/upload-artifact@v4
        if: matrix.type == 'release'
        with:
          name: PokeVerse-Server-Linux
          path: dist/split/PokeVerse-Server-Linux.tar.gz
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: matrix.type == 'release'
        with:
          name: PokeVerse-Redemption-Linux
          path: dist/split/PokeVerse-Redemption-Linux.tar.gz
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: matrix.type == 'release'
        with:
          name: PokeVerse-Legacy-Linux
          path: dist/split/PokeVerse-Legacy-Linux.tar.gz
          if-no-files-found: error
          compression-level: 0

      - name: Redemption client login, gameplay smoke, two-account market test and logout (Trainer, GM Admin)
        timeout-minutes: 30
        if: matrix.type == 'release'
        run: |
          mkdir -p e2e
          tools/stage_redemption.sh release
          KEEP_RUNNING=1 tools/smoke_server.sh e2e/server.log
          export DISPLAY=:99
          status=0
          SCREENSHOT=e2e/linux-ingame-trainer.png tools/smoke_redemption_login.sh e2e/client-trainer.log || status=1
          # A fresh database gives GM Admin no Pokemon; the Pokemon bar checks summon one and switch to the other.
          python3 tools/protocol_client.py enter admin admin "GM Admin" --say "/cb Charmander, 15, 10" --say "/cb Bulbasaur, 15, 10" || status=1
          PV_ACCOUNT=admin PV_PASSWORD=admin PV_CHARACTER="GM Admin" PV_EXPECT_POKEBAR=1 SCREENSHOT_AT="WALK OK" SCREENSHOT=e2e/linux-ingame-gm.png \
            tools/smoke_redemption_login.sh e2e/client-gm.log || status=1
          tools/smoke_market.sh e2e || status=1
          pkill -9 -f pokeverse-server || true
          exit $status

      - name: Package end-to-end test (extract outside the checkout, setup-database.sh, start-server.sh, packaged client in game, clean stop)
        if: matrix.type == 'release'
        timeout-minutes: 30
        run: |
          pkill -9 -f pokeverse-server || true
          sleep 2
          DISPLAY=:99 tools/test_linux_package.sh dist/linux/PokeVerse-Linux-Dev.tar.gz "$PWD/e2e/package"

      - name: Separate packages end to end (extract side by side, setup, one server, launchers, both clients in game, stop-server.sh)
        if: matrix.type == 'release'
        timeout-minutes: 30
        run: DISPLAY=:99 tools/test_split_packages.sh linux dist/split "$PWD/e2e/split"

      - uses: actions/upload-artifact@v4
        if: always() && matrix.type == 'release'
        with:
          name: PokeVerse-Client-Comparison-Results-Linux
          path: e2e/split/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pokeverse-client-linux-x64-${{ matrix.type }}
          path: |
            dist/packages/
            launch-${{ matrix.type }}.png
            /tmp/redemption.log
            e2e/
          if-no-files-found: ignore

  # v* tags: attach the validated packages of this run to the GitHub Release of the tag
  # (created when missing). Only runs when every build, validation and end-to-end job passed.
  release:
    name: GitHub Release (v* tags)
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: [windows-client, windows-legacy-client, windows-e2e, windows-package, android-client, linux-client]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PokeVerse-Windows-Dev
          path: artifacts/windows
      - uses: actions/download-artifact@v4
        with:
          name: PokeVerse-Linux-Dev
          path: artifacts/linux
      - uses: actions/download-artifact@v4
        with:
          name: PokeVerse-Android-arm64
          path: artifacts/android
      - uses: actions/download-artifact@v4
        with:
          pattern: PokeVerse-*-Windows
          path: artifacts/split-windows
      - uses: actions/download-artifact@v4
        with:
          pattern: PokeVerse-*-Linux
          path: artifacts/split-linux
          merge-multiple: true

      - name: Name the release assets
        run: |
          v="$GITHUB_REF_NAME"
          mkdir -p release
          [ -f artifacts/windows/PokeVerse-Windows-Dev/server/pokeverse-server.exe ] || { echo "Windows package incomplete"; exit 1; }
          (cd artifacts/windows && zip -qr -9 "../../release/PokeVerse-Windows-Dev-$v.zip" PokeVerse-Windows-Dev)
          cp artifacts/linux/PokeVerse-Linux-Dev.tar.gz "release/PokeVerse-Linux-Dev-$v.tar.gz"
          cp artifacts/android/PokeVerse-Android-arm64.apk "release/PokeVerse-Android-arm64-$v.apk"
          cp artifacts/android/PokeVerse-Android-arm64.apk "release/PokeVerse-Redemption-Android-arm64-$v.apk"
          for name in Server Redemption Legacy Client-Comparison; do
            d="artifacts/split-windows/PokeVerse-$name-Windows"
            [ -f "$d/VERSION.txt" ] || { echo "PokeVerse-$name-Windows missing"; exit 1; }
            (cd "$d" && zip -qr -9 "$GITHUB_WORKSPACE/release/PokeVerse-$name-Windows-$v.zip" .)
          done
          for name in Server Redemption Legacy; do
            cp "artifacts/split-linux/PokeVerse-$name-Linux.tar.gz" "release/PokeVerse-$name-Linux-$v.tar.gz"
          done
          (cd release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          ls -la release

      - name: Publish to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          v="$GITHUB_REF_NAME"
          notes="PokeVerse $v development build from ${GITHUB_SHA::12} (workflow run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID).
          How to run: docs/DOWNLOAD_AND_RUN.md. DEVELOPMENT ONLY: local server at 127.0.0.1, development database defaults."
          if gh release view "$v" > /dev/null 2>&1; then
            gh release upload "$v" release/* --clobber
          else
            gh release create "$v" release/* --title "PokeVerse $v (development build)" --notes "$notes" --prerelease --verify-tag
          fi
